<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Chat App</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f1f1f1;
    }
    #chat-container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px #aaa;
    }
    #messages {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 70%;
      display: inline-block;
    }
    .user { background: #d1e7dd; align-self: flex-end; }
    .bot { background: #f8d7da; align-self: flex-start; }
    .other { background: #cfe2ff; align-self: flex-start; }
    #input-area {
      display: flex;
      border-top: 1px solid #ccc;
    }
    #input {
      flex: 1;
      padding: 15px;
      border: none;
      font-size: 16px;
    }
    #send {
      padding: 15px 20px;
      border: none;
      background: #0d6efd;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="input" placeholder="Type a message..." />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const ws = new WebSocket(`ws://${location.host}/ws/chat`);
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const messages = document.getElementById("messages");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.classList.add("message");

      if (sender.startsWith("You")) div.classList.add("user");
      else if (sender.startsWith("Bot")) div.classList.add("bot");
      else div.classList.add("other");

      div.textContent = `${sender}: ${text}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.onclick = () => {
      if (input.value.trim()) {
        ws.send(input.value.trim());
        input.value = "";
      }
    };

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    ws.onmessage = (event) => {
      const [sender, ...msg] = event.data.split(": ");
      addMessage(msg.join(": "), sender);
    };

    ws.onopen = () => {
      addMessage("Connected to smart chat server", "System");
    };
  </script>
</body>
</html>
